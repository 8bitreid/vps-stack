## traefik.yml

# Entry Points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "172.64.0.0/13"
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "131.0.72.0/22"
  metrics:
    address: ":8082"

# Docker configuration backend
providers:
  docker:
    defaultRule: "Host(`{{ trimPrefix `/` .Name }}.docker.localhost`)"
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic-config.yml
    watch: true

# Experimental features and plugins
experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.3.5
    geoblock:
      moduleName: github.com/PascalMinder/geoblock
      version: v0.3.7

# API and dashboard configuration
api:
  dashboard: false
  insecure: false

# Ping endpoint for health checks
ping: {}

# Certificate resolvers
certificatesResolvers:
  myresolver:
    acme:
      # Using DNS challenge with Cloudflare (NOT HTTP challenge)
      # This allows certificate generation even when ports 80/443 are not directly accessible
      # and works well with Cloudflare's proxy service
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10s
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
      email: reidscertinfo@gmail.com
      storage: /letsencrypt/acme.json
      # Production Let's Encrypt server
      caServer: https://acme-v02.api.letsencrypt.org/directory

# Logging
log:
  level: INFO

# Access logs for CrowdSec
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: "json"
  fields:
    headers:
      names:
        X-IPCountry: keep  # Log the country code added by GeoBlock
        CF-IPCountry: keep  # Log Cloudflare's country header
        X-Forwarded-For: keep
        X-Real-IP: keep
        CF-Connecting-IP: keep

# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: metrics
    headerLabels:
      client_ip: "X-Forwarded-For"
      real_ip: "X-Real-IP"
      cf_connecting_ip: "CF-Connecting-IP"
