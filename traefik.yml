# Entry Points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # Removed trustedIPs for Cloudflare proxy ranges since you run Grey Cloud (direct IP)
  metrics:
    address: ":8082"

# Docker configuration backend
providers:
  docker:
    defaultRule: "Host(`{{ trimPrefix `/` .Name }}.docker.localhost`)"
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic-config.yml
    watch: true

# Experimental features and plugins
experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.3.5
    geoblock:
      moduleName: github.com/PascalMinder/geoblock
      version: v0.3.7

# API and dashboard configuration
api:
  dashboard: false
  insecure: false

# Ping endpoint for health checks
ping: {}

# Certificate resolvers (ACME DNS-01 Challenge via Cloudflare API token)
certificatesResolvers:
  myresolver:
    acme:
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10s
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
      email: reidscertinfo@gmail.com
      storage: /letsencrypt/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory

# Logging
log:
  level: INFO

# Access logs for CrowdSec
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: "json"
  fields:
    headers:
      names:
        X-IPCountry: keep        # Log country code added by GeoBlock
        X-Forwarded-For: keep    # Log real client IP
        X-Real-IP: keep          # Log real client IP

# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: metrics
    headerLabels:
      client_ip: "X-Forwarded-For"
      real_ip: "X-Real-IP"
