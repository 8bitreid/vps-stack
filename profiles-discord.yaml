name: default_ip_remediation
#debug: true
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
 - type: ban
   duration: 4h
   simulated: false
notifications:
   - http_default  # Discord webhook via HTTP
on_success: break
